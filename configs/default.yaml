# Default pipeline configuration. Override per run in a stage notebook's parameters cell:
#   cfg = load_config(resolve_path("configs/default.yaml"), ["device=mps"])
# Paths are relative to the repo root.

# Inference device for detection/pose/classification: cpu | mps | cuda | cuda:0
device: cpu

# Every stage writes to <runs_dir>/<video_stem>/ (see CLAUDE.md for the file list).
runs_dir: data/runs

video:
  fps: 60            # SF6 runs at 60 fps. Frames are never skipped or downsampled.

# Regions blacked out before *detection only* (pose and the video use the full frame).
# Coordinates are fractions of frame width/height: [x0, y0, x1, y1], so the same config
# works at any resolution. Off by default: on the 1080p test clip the HUD produced no
# person boxes above the tracker's min_score. Don't mask the bottom Drive/Super gauges:
# grounded fighters' feet reach ~97% of frame height.
hud_mask:
  enabled: false
  regions: []
  # Example: health bars, timer and player cards
  #   - [0.00, 0.00, 1.00, 0.10]

characters: [chunli, ken]   # chunli is the primary character

movelists:
  chunli: configs/movelists/chunli.csv
  ken: configs/movelists/ken.csv

# Stage 2: RTMDet-m person detector. On MPS the network runs on the GPU and only
# post-processing (NMS, which has no MPS kernel in mmcv) runs on the CPU.
detection:
  config: configs/mmdet/rtmdet_m_person.py
  checkpoint: models/rtmdet_m_8xb32-100e_coco-obj365-person-235e8209.pth
  batch_size: 8
  save_score: 0.2     # boxes at or above this are saved to detections.npz

# Picking P1/P2 out of the detections: any field of sf6mr.track.TrackerParams,
# e.g. `min_score: 0.3`. Defaults were tuned on the 1080p Ken vs. Chun-Li test clip.
tracker: {}

# Stage 3: RTMPose-m, COCO-17, top-down on the two fighter boxes.
pose:
  config: configs/mmpose/rtmpose_m_coco_256x192.py
  checkpoint: models/rtmpose-m_simcc-coco_pt-aic-coco_420e-256x192-d8dd5ca4_20230127.pth

# Annotated video
render:
  min_joint_score: 0.3   # joints below this RTMPose score aren't drawn
  crf: 20                # H.264 quality (lower = better, bigger)

# Stage 4: normalization (hip-centered, torso-scaled, every fighter facing +x).
# Any field of sf6mr.normalize.NormalizeParams, e.g. `max_gap: 10` or `smooth_window: 0`.
normalize: {}

# Stage settings are added as each phase is implemented:
#   autolabel / clips       -> Phase 4
#   classifier / events     -> Phase 5
#   timeline / render       -> Phase 6
